<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma consommation</title>
<style>
body{margin:0;padding:16px;background:#0b1f2a;color:#e8f1f5;font-family:sans-serif}
a{color:#4ade80;text-decoration:none}
.box{background:#12303f;border-radius:14px;padding:14px;margin:12px 0}
.total{font-size:34px;font-weight:bold;color:#4ade80}
.top{display:flex;justify-content:space-between;margin-top:14px}
.bar{height:8px;background:#0b1f2a;border-radius:4px;margin-top:5px}
.fill{height:8px;background:#4ade80;border-radius:4px}
button{background:#4ade80;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:bold}
</style></head><body>
<a href="./">← Retour</a>
<h2>📊 Ma consommation</h2>
<div id="m" class="box">Chargement…</div>
<button onclick="load()">Actualiser</button>
<script>
function fmt(x){return x>=1000?(x/1000).toFixed(2)+' Go':x.toFixed(1)+' Mo'}
function add(p,t,s,c){var e=document.createElement(t);e.textContent=s;if(c)e.className=c;p.appendChild(e);return e}
function load(){
var m=document.getElementById('m');m.textContent='';
if(!window.DourgaUsage){add(m,'div','Ouvrez cette page dans Dourga Data.');return}
var d;try{d=JSON.parse(DourgaUsage.today())}catch(e){add(m,'div','Lecture impossible.');return}
if(!d.access){
add(m,'div','Autorisez Dourga Data une seule fois : choisissez Dourga Data puis activez l’accès.');
add(m,'button','Autoriser').onclick=function(){DourgaUsage.openAccessSettings()};return}
if(d.error){add(m,'div','Erreur : '+d.error);return}
add(m,'div','Aujourd’hui, données mobiles');
add(m,'div',fmt(d.totalMb),'total');
var max=d.apps.length?d.apps[0].mb:1;
d.apps.forEach(function(a){
var t=add(m,'div','','top');
add(t,'span',a.name);add(t,'span',fmt(a.mb));
var b=add(m,'div','','bar');
add(b,'div','','fill').style.width=Math.max(3,Math.round(a.mb/max*100))+'%'})}
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
load();
</script></body></html>
